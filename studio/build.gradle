plugins { id 'com.android.application' }
android {
    namespace 'cn.wuziping.studio'
    compileSdk 34
    defaultConfig { applicationId 'cn.wuziping.ember'; minSdk 23; targetSdk 34; versionCode 27; versionName '0.1.19' }
    sourceSets {
        main.java.srcDirs += ['../core/src/main/java','../app/src/main/java']
        main.assets.srcDirs += ['../app/src/main/assets']
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    androidResources { noCompress 'wasm','zip','wav','js','mjs' }
    buildTypes { release { minifyEnabled false } }
}
