name: Verify entry points

on:
  push:
    branches: [main]
  pull_request:

jobs:
  entrypoints:
    name: 校验入口 · 工作室网页测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/web/package-lock.json
      - name: 天工开发检查与严格门槛应当通过
        run: |
          set -o pipefail
          python3 tools/verify-studio-release.py | tee /tmp/studio-dev.txt
          python3 tools/verify-studio-release.py --strict | tee /tmp/studio-strict.txt
          grep -q '^EXIT: PASS$' /tmp/studio-dev.txt
          grep -q '^EXIT: PASS$' /tmp/studio-strict.txt
          grep -E '^SUMMARY: mode=dev PASS=[0-9]+ FAIL=0 SKIP=0 KNOWN=0 NOTE=[0-9]+$' /tmp/studio-dev.txt
          grep -E '^SUMMARY: mode=strict PASS=[0-9]+ FAIL=0 SKIP=0 KNOWN=0 NOTE=[0-9]+$' /tmp/studio-strict.txt
          grep -q 'fallback matches index.html' /tmp/studio-strict.txt
          if grep -q 'published assets/studio/editor.page is not the current index' /tmp/studio-strict.txt; then
            echo '天工回退页又和当前首页不一致'
            exit 1
          fi
          if grep -q 'java/zipalign/aapt/apksigner not all present' /tmp/studio-strict.txt; then
            echo 'Java 缺失和 SDK 工具缺失被写在了同一句里'
            exit 1
          fi
      - name: Python 校验入口
        run: python3 tools/test_verify_support.py
      - name: 游戏发行检查（缺包或硬失败不得通过）
        run: |
          set +e
          python3 tools/verify-release.py > /tmp/game-dev.txt
          game=$?
          python3 tools/verify-release.py --strict > /tmp/game-strict.txt
          strict=$?
          set -e
          cat /tmp/game-dev.txt
          echo '---'
          cat /tmp/game-strict.txt
          test "$game" -eq 0
          test "$strict" -eq 0
          grep -q '^EXIT: PASS$' /tmp/game-dev.txt
          grep -q '^EXIT: PASS$' /tmp/game-strict.txt
          grep -E '^SUMMARY: mode=dev PASS=[0-9]+ FAIL=0 SKIP=0 KNOWN=0 NOTE=[0-9]+$' /tmp/game-dev.txt
          grep -E '^SUMMARY: mode=strict PASS=[0-9]+ FAIL=0 SKIP=0 KNOWN=0 NOTE=[0-9]+$' /tmp/game-strict.txt
          if grep -q 'file is not in dist/' /tmp/game-strict.txt || grep -q 'java or apksigner' /tmp/game-strict.txt; then
            echo '游戏当前包缺失，或 Java 与 SDK 工具被写在了同一句里'
            exit 1
          fi
      - name: 首页卡片静态检查
        run: node tools/test-merged-ui.js
      - name: 安装天工网页依赖
        working-directory: studio/web
        run: npm ci
      - name: 接口修复校验（含临时构建）
        run: |
          python3 tools/verify-interface-fix.py
          python3 tools/verify-interface-fix.py --strict
      - name: 天工网页测试
        working-directory: studio/web
        run: npm test
