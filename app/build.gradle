plugins { id 'com.android.application' }
android {
    namespace 'cn.wuziping.ember'
    compileSdk 34
    defaultConfig {
        applicationId 'cn.wuziping.ember'
        minSdk 23
        targetSdk 34
        versionCode 8
        versionName '0.7.1'
    }
    sourceSets { main.java.srcDirs += '../core/src/main/java' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    buildTypes { release { minifyEnabled false } }
}

def repoRoot = rootProject.projectDir
tasks.register('packagePreflight', Exec) {
    group = 'verification'
    description = 'Validate game package inputs. Does not assemble an APK.'
    workingDir repoRoot
    commandLine 'python3', "${repoRoot}/tools/package_preflight.py", '--root', repoRoot, '--inputs-only'
}
afterEvaluate {
    tasks.matching { it.name == 'preBuild' }.configureEach {
        dependsOn 'packagePreflight'
    }
}
